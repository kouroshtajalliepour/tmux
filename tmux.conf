# Entry point. Everything lives in conf/ by topic, scripts in scripts/:
#   conf/general.conf   core tmux options + plugin list/restore settings
#   conf/bindings.conf   pane navigation, clipboard
#   conf/theme.conf      Catppuccin Mocha status bar / borders / popups
#   conf/project.conf    project session picker + branch switch (S / s / B)
source-file ~/.config/tmux/conf/general.conf
source-file ~/.config/tmux/conf/bindings.conf
source-file ~/.config/tmux/conf/theme.conf
source-file ~/.config/tmux/conf/project.conf

run '~/.tmux/plugins/tpm/tpm'

# Use Ctrl+b + h/j/k/l to move between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Copy tmux selection to system clipboard
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel \; run-shell "tmux save-buffer - | xclip -selection clipboard"

# Project picker
bind-key S display-popup -E "~/.local/bin/tmux-sessionizer"

##### GENERAL #####
set -g base-index 0
setw -g pane-base-index 0
set -g renumber-windows on
set -g mode-keys vi
##### CLEAN BEHAVIOR #####
set -g allow-rename off
set -g history-limit 10000

##### PLUGINS #####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
unbind-key -T prefix C-s
set -g @resurrect-save '`'

##### AUTO SAVE/RESTORE #####
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

##### IMPORTANT #####
set -g @resurrect-capture-pane-contents 'on'

run '~/.tmux/plugins/tpm/tpm'

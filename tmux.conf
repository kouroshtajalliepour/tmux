# Use Ctrl+b + h/j/k/l to move between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Copy tmux selection to system clipboard
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel \; run-shell "tmux save-buffer - | xclip -selection clipboard"

# Project picker (fzf popup)
bind-key S display-popup -w 70% -h 70% -T " Projects " -E "~/.local/bin/tmux-sessionizer"

# Session tree, styled to match
bind-key s choose-tree -Zs -F "#{?session_attached,● ,  }#{session_name}#{?session_attached, (attached),}"

##### GENERAL #####
set -g base-index 0
setw -g pane-base-index 0
set -g renumber-windows on
set -g mode-keys vi
##### CLEAN BEHAVIOR #####
set -g allow-rename off
set -g history-limit 10000

##### PLUGINS #####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
unbind-key -T prefix C-s
set -g @resurrect-save '`'

##### AUTO SAVE/RESTORE #####
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

##### IMPORTANT #####
set -g @resurrect-capture-pane-contents 'on'


# Position and layout
set -g status on
set -g status-position top
set -g status-justify absolute-centre
set -g status-interval 5

# Catppuccin Mocha theme (bar uses mantle, a shade darker than alacritty's base)
# base=#1e1e2e mantle=#181825 text=#cdd6f4 overlay2=#9399b2 surface0=#313244 mauve=#cba6f7
set -g status-style "bg=#181825,fg=#cdd6f4"

# Left: session name + uncommitted changes (staged/unstaged/untracked)
set -g status-left-length 40
set -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[fg=#cba6f7,bg=#181825] #(~/.config/tmux/scripts/git_status.sh changes \"#{pane_current_path}\")"

# Center: window list (zoom flag shown when a pane is zoomed)
setw -g window-status-separator " "
setw -g window-status-format "#[fg=#9399b2,bg=#181825] #I:#W#{?window_zoomed_flag,*,} "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#cba6f7,bold] #I:#W#{?window_zoomed_flag,*,} "

# Right: git branch, then clock
set -g status-right-length 50
set -g status-right "#(~/.config/tmux/scripts/git_status.sh branch \"#{pane_current_path}\") #[fg=#9399b2] %a %d %b #[fg=#cdd6f4,bold] %H:%M "

# Subtle pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"

# Messages
set -g message-style "bg=#cba6f7,fg=#1e1e2e,bold"

# Popups (prefix+S project picker) and menus, matching theme
set -g popup-border-lines rounded
set -g popup-border-style "fg=#cba6f7,bg=#1e1e2e"
set -g popup-style "fg=#cdd6f4,bg=#1e1e2e"
set -g menu-border-lines rounded
set -g menu-border-style "fg=#cba6f7,bg=#1e1e2e"
set -g menu-style "fg=#cdd6f4,bg=#1e1e2e"
set -g menu-selected-style "fg=#1e1e2e,bg=#cba6f7,bold"

# Mode selection highlight (prefix+s session tree, copy-mode, etc.)
set -g mode-style "fg=#1e1e2e,bg=#cba6f7,bold"

run '~/.tmux/plugins/tpm/tpm'

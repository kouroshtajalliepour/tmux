##### THEME: Catppuccin Mocha (matches ~/.config/alacritty/alacritty.toml) #####
# base=#1e1e2e mantle=#181825 text=#cdd6f4 overlay2=#9399b2 surface0=#313244 mauve=#cba6f7
# The bar itself sits on mantle, one shade darker than the terminal's base,
# so it reads as a distinct strip rather than blending into it.

# Position and layout
set -g status on
set -g status-position top
set -g status-justify absolute-centre
set -g status-interval 5

set -g status-style "bg=#181825,fg=#cdd6f4"

# Left: session name + uncommitted changes (staged/unstaged/untracked)
set -g status-left-length 40
set -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[fg=#cba6f7,bg=#181825] #(~/.config/tmux/scripts/git_status.sh changes \"#{pane_current_path}\")"

# Center: window list (zoom flag shown when a pane is zoomed)
setw -g window-status-separator " "
setw -g window-status-format "#[fg=#9399b2,bg=#181825] #I:#W#{?window_zoomed_flag,*,} "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#cba6f7,bold] #I:#W#{?window_zoomed_flag,*,} "

# Right: git branch, then clock
set -g status-right-length 50
set -g status-right "#(~/.config/tmux/scripts/git_status.sh branch \"#{pane_current_path}\") #[fg=#9399b2] %a %d %b #[fg=#cdd6f4,bold] %H:%M "

# Subtle pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"

# Messages
set -g message-style "bg=#cba6f7,fg=#1e1e2e,bold"

# Popups and menus (float over the terminal, so they stay on base, not mantle)
set -g popup-border-lines rounded
set -g popup-border-style "fg=#cba6f7,bg=#1e1e2e"
set -g popup-style "fg=#cdd6f4,bg=#1e1e2e"
set -g menu-border-lines rounded
set -g menu-border-style "fg=#cba6f7,bg=#1e1e2e"
set -g menu-style "fg=#cdd6f4,bg=#1e1e2e"
set -g menu-selected-style "fg=#1e1e2e,bg=#cba6f7,bold"

# Mode selection highlight (session tree, copy-mode, etc.)
set -g mode-style "fg=#1e1e2e,bg=#cba6f7,bold"

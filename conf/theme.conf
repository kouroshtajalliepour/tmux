##### THEME: Catppuccin Mocha (matches ~/.config/alacritty/alacritty.toml) #####
# base=#1e1e2e mantle=#181825 text=#cdd6f4 overlay2=#9399b2 surface0=#313244 blue=#89b4fa
# The bar itself sits on mantle, one shade darker than the terminal's base,
# so it reads as a distinct strip rather than blending into it.

# Position and layout
set -g status on
# production: bottom instead of top
set -g status-position bottom
set -g status-justify absolute-centre
set -g status-interval 5

set -g status-style "bg=#181825,fg=#cdd6f4"

# Session name is colored by what it is - the four hand-maintained
# fixed sessions matched by exact name, everything else by its category
# prefix (see project.conf / category_hub.sh):
#   Todos (exact) -> peach    Sys (exact) -> blue    Media (exact) -> pink
#   Infra (exact) -> red
#   l-*/lr-* (live-websites - the website container and its actual
#     GitHub repos are both green, no distinction)                -> green
#   j-* (Packages)                                                 -> mauve
#   anything else (saved sessions, ad-hoc, ...)                     -> blue
# NOTE: must be read back with the E: format modifier (twice-expand) -
# #{@session_bg} alone only gives the literal unexpanded string, tmux
# doesn't recursively re-parse a stored @-option's own #{...} content.
set -g @session_bg "#{?#{==:#S,Todos},#fab387,#{?#{==:#S,Sys},#89b4fa,#{?#{==:#S,Media},#f5c2e7,#{?#{==:#S,Infra},#f38ba8,#{?#{m:l*-*,#S},#a6e3a1,#{?#{m:j-*,#S},#cba6f7,#89b4fa}}}}}}"

# Left: project name for dynamic sessions (set as @display_name at
# creation time in build_project_session - just the project, no prefix
# or branch, since the branch already shows on the right), falling
# back to the plain session name for the 4 fixed sessions, which never
# set @display_name. Then vi mode (bash `set -o vi`, via ~/.inputrc
# pushing NORMAL/INSERT into the pane title; VISUAL covers tmux
# copy-mode itself), then the current pane's git changes (staged/
# unstaged/untracked counts).
set -g status-left-length 60
set -g status-left "#[fg=#1e1e2e,bg=#{E:@session_bg},bold] #{?#{@display_name},#{@display_name},#S} #[fg=#{E:@session_bg},bg=#181825] #{?#{==:#{pane_current_command},fish},#[fg=#94e2d5,bold]fish#[default] ,}#{?pane_in_mode,#[fg=#89b4fa,bold]VISUAL#[default],#{?#{==:#{pane_title},NORMAL},#[fg=#a6e3a1,bold]NORMAL#[default],#[fg=#f9e2af,bold]INSERT#[default]}} #(~/.config/tmux/scripts/git_status.sh changes \"#{pane_current_path}\")"

# Center: window list (zoom flag shown when a pane is zoomed). Colored
# by the session's slot (see @session_bg above) - same colors the
# session name and status-left pill already use.
setw -g window-status-separator " "
setw -g window-status-format "#[fg=#{E:@session_bg},bg=#181825] #I:#W#{?window_zoomed_flag,*,} "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#{E:@session_bg},bold] #I:#W#{?window_zoomed_flag,*,} "

# Right: git branch, then clock
set -g status-right-length 60
set -g status-right "#(~/.config/tmux/scripts/git_status.sh branch \"#{pane_current_path}\") #[fg=#9399b2] %a %d %b #[fg=#cdd6f4,bold] %H:%M "

# Subtle pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Messages
set -g message-style "bg=#89b4fa,fg=#1e1e2e,bold"

# Popups and menus (float over the terminal, so they stay on base, not mantle)
set -g popup-border-lines rounded
set -g popup-border-style "fg=#89b4fa,bg=#1e1e2e"
set -g popup-style "fg=#cdd6f4,bg=#1e1e2e"
set -g menu-border-lines rounded
set -g menu-border-style "fg=#89b4fa,bg=#1e1e2e"
set -g menu-style "fg=#cdd6f4,bg=#1e1e2e"
set -g menu-selected-style "fg=#1e1e2e,bg=#89b4fa,bold"

# Mode selection highlight (session tree, copy-mode, etc.)
set -g mode-style "fg=#1e1e2e,bg=#89b4fa,bold"

# Cursor shape follows mode: block while in copy-mode (prefix+[, visual
# selection, choose-tree, ...), blinking bar the rest of the time.
set-hook -g pane-mode-changed 'run-shell -b "~/.config/tmux/scripts/cursor_shape.sh #{pane_tty} #{pane_in_mode}"'
set-hook -g pane-focus-in 'run-shell -b "~/.config/tmux/scripts/cursor_shape.sh #{pane_tty} #{pane_in_mode}"'

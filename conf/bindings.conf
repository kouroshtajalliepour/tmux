##### KEYBINDINGS #####

# prefix (Ctrl+a) + h/j/k/l to move between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Copy tmux selection to system clipboard
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel \; run-shell "tmux save-buffer - | xclip -selection clipboard"

# ~/.jarvis reports: i picks and opens, y copies a search to paste and edit
bind-key i display-popup -w 90% -h 90% -T " Reports " -E "~/.config/tmux/scripts/jarvis_reports.sh"
bind-key y run-shell -b "~/.config/tmux/scripts/jarvis_grep.sh"

# The last response of the Claude in this pane, in nvim (the reverse of its ctrl-g)
bind-key G display-popup -w 90% -h 90% -T " Last response " -E "~/.config/tmux/scripts/claude_last_response.sh '#{pane_pid}'"

# tmux-continuum owns save/restore; free up prefix+Ctrl-s
unbind-key -T prefix C-s

##### PROJECT WORKFLOW #####
# A "project session" has windows 0:main 7:code 8:term 9:ai, all in the
# project's directory (built by scripts/tmux-sessionizer). Windows 1-6 are
# left free for whatever extra terminals you add yourself. See scripts/
# for the logic behind each binding below.

# prefix+S: fzf-pick a project under ~/Documents. Opens it if the session
# already exists, otherwise builds the 0:main/7:code/8:term/9:ai layout.
bind-key S display-popup -w 70% -h 70% -T " Projects " -E "~/.config/tmux/scripts/tmux-sessionizer"

# prefix+s: fzf session switcher (same picker style as prefix+S).
bind-key s display-popup -w 70% -h 70% -T " Sessions " -E "~/.config/tmux/scripts/session_switch.sh"

# prefix+B: bulk-switch the code/term/ai windows to another branch. Only
# runs when the current session actually has that layout.
bind-key B display-popup -w 70% -h 70% -T " Switch Branch " -E "~/.config/tmux/scripts/branch_switch.sh"

# Make sure the always-on `sys` session exists every time the server boots.
run-shell "~/.config/tmux/bootstrap_sys.sh"

# prefix+0/1/2/3: jump straight to the matching saved session (0-media,
# 1-Sys, 2-Docs, 3-ssh). Only bound for the digits actually in use -
# 7/8/9 stay as tmux's normal "switch to window 7/8/9" since that's how
# project sessions reach their code/term/ai windows (see tmux-sessionizer).
bind-key 0 run-shell "~/.config/tmux/scripts/jump_session.sh 0"
bind-key 1 run-shell "~/.config/tmux/scripts/jump_session.sh 1"
bind-key 2 run-shell "~/.config/tmux/scripts/jump_session.sh 2"
bind-key 3 run-shell "~/.config/tmux/scripts/jump_session.sh 3"

##### SESSIONS (production) #####
# One session, named after the machine's short hostname, made on boot
# by bootstrap_server.sh. None of
# master's personal sessions (Sys, Media, Todos, Infra), project
# pickers, hub, pins or branch switching.
#
# prefix+f: fuzzy search over the windows (same key as master's main
# sessions). prefix+s is unbound, like on master.

bind-key f display-popup -w 70% -h 70% -T " #{host_short} " -E "~/.config/tmux/scripts/session_switch.sh"
unbind-key s

run-shell "~/.config/tmux/bootstrap_server.sh"

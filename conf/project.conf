##### PROJECT WORKFLOW (production) #####
# Stripped down for the production branch: no category pickers
# (h/H/j/J/k/K/l/L), no hub (m), no sibling-branch switcher (g), no
# built-in session tree (v), and no auto-created sessions on boot - just
# the fuzzy session switcher.

bind-key s display-popup -w 70% -h 70% -T " Sessions " -E "~/.config/tmux/scripts/session_switch.sh"

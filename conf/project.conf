##### PROJECT WORKFLOW #####
# A "project session" has windows 0:repo 7:vi 8:tr 9:ai, all in the
# project's directory (built by scripts/tmux-sessionizer). Windows 1-6 are
# left free for whatever extra terminals you add yourself. See scripts/
# for the logic behind each binding below.
#
# Four fixed sessions you maintain by hand (Sys/Infra/Media/Todos -
# tmux-resurrect/continuum keep them around across restarts), plus the
# code sessions, one category per folder under ~/Documents/repos:
#   packages/  Packages  "j-*"   mauve
#   live/      Live      "l-*" ("lr-*" one wrapper folder down)  green
#   infra/     Infra     "i-*"   teal
#   training/  Training  "t-*"   yellow - <Person>/<repo>, person first
# Only the main 4 come back after a reboot; code sessions are built when
# you open them (pickers, pins, j/k).
#
# prefix+h/j/k/l is navigation, not fixed jumps:
#   h / l   previous / next pinned project, landing on the branch you used
#           last there (scripts/project_nav.sh). prefix+0-9 selects windows
#   j / k   next / previous session (scripts/session_cycle.sh):
#             in one of the main 4 -> cycles Sys, Infra, Media, Todos
#             anywhere else        -> cycles the pinned branches of this
#                                     project (~/.local/state/tmux/pinned-branches.tsv),
#                                     starting any that aren't running
#           a "branch 2/5: name" / "main 1/4: Sys" message shows where you are
# Scripts run from these bindings get the session and client the key was
# pressed in ('#{session_name}' '#{client_name}') - left to guess, tmux can
# pick the other attached client (e.g. the alt+` drop-down).
# Arrow keys stay pane navigation (tmux's own default) - bindings.conf's
# h/j/k/l select-pane is overridden by the above.
#
# Repo pickers, one per category - Shift+<letter> directly, or prefix+m
# (the PlayStation-button-style hub) and the same letter:
#   K / hub K   Packages project picker      hub k  last Packages project's branches
#   L / hub L   Live project picker          hub l  last Live project's branches
#   J / hub J   Infra project picker         hub j  last Infra project's branches
#   H / hub H   Training: person, then repo  hub h  last Training project's branches
# The plain-letter hub keys open the full project picker instead if
# there's no last project yet. The hub's 1-4 are Sys, Infra, Media, Todos -
# the one place with a key per main session (j/k cycles them, p jumps back).
# The hub sizes itself to the screen, so it fits the alt+` drop-down too.
# k/K is Packages (not j/J) since k sits right next to l on the keyboard;
# the "j-" session prefix stayed. Every session opened through these
# pickers is pinned automatically (pin_add in project_lib.sh).

bind-key m display-popup -B -w 100% -h 100% -E "~/.config/tmux/scripts/category_hub.sh"

bind-key h run-shell "~/.config/tmux/scripts/project_nav.sh prev '#{session_name}' '#{client_name}'"
bind-key l run-shell "~/.config/tmux/scripts/project_nav.sh next '#{session_name}' '#{client_name}'"
bind-key j run-shell "~/.config/tmux/scripts/session_cycle.sh next '#{session_name}' '#{client_name}' project"
bind-key k run-shell "~/.config/tmux/scripts/session_cycle.sh prev '#{session_name}' '#{client_name}' project"
bind-key H display-popup -w 70% -h 70% -T " Training " -S "fg=#f9e2af" -E "~/.config/tmux/scripts/training_picker.sh '$HOME/Documents/repos/training'"
bind-key J display-popup -w 70% -h 70% -T " Infra " -S "fg=#94e2d5" -E "~/.config/tmux/scripts/tmux-sessionizer '$HOME/Documents/repos/infra' i"
bind-key K display-popup -w 70% -h 70% -T " Packages " -S "fg=#cba6f7" -E "~/.config/tmux/scripts/tmux-sessionizer '$HOME/Documents/repos/packages' j"
bind-key L display-popup -w 70% -h 70% -T " Live " -S "fg=#a6e3a1" -E "~/.config/tmux/scripts/tmux-sessionizer '$HOME/Documents/repos/live' l"
# prefix+M is tmux's own again (mark pane) - the main 4 live on the hub's 1-4
bind-key M select-pane -M

# prefix+f: find, depending on where you are:
#   in one of the main 4 -> fuzzy-pick a window of the main 4
#                           (scripts/session_switch.sh)
#   anywhere else        -> the pinned branches of the project you're in
# prefix+F: the pinned projects, one row each (scripts/project_nav.sh).
# prefix+n: tmux's own find-window (the stock prefix+f).
# prefix+o: show this project in the preview browser on workspace 10 (the
#   lone alt tap does the same from workspace 1): its dev server is started in window 6
#   if it isn't running (scripts/preview.sh, ~/.local/state/tmux/session-bios.tsv).
#   A session that isn't a known project gets the port picker instead.
# prefix+O: the port picker - any running dev server, or type a port
#   (scripts/port_open.sh).
# prefix+p: back and forth between your last main session and your last
#   code session (scripts/last_session.sh, fed by the hook at the bottom).
# h/l already do next/previous window, so n/p were free; g and s are
# unbound (spare).
#
# Pinned sessions (scripts/pins.sh):
#   a        pin/unpin the current session
#   f        (outside the main 4) picker over the pins - "*" = a window there finished while
#            you were away, dim ○ = not running (picking it rebuilds it),
#            ctrl-x unpins the row; pins whose project directory is
#            gone (and whose session isn't running) are dropped on open
#   X        self-destruct: back to Sys, kill this session (pins kept)
# Sessions opened through the repo pickers (H/J/K/L, hub) are pinned
# automatically. The per-project branch picker is on prefix+m k/l.
#
# prefix+N / prefix+P: next/prev branch of the project you're in (e.g.
# tmux master <-> production), building its session if it isn't running.
bind-key f if-shell -F "#{m/r:^(Sys|Infra|Media|Todos)$,#{session_name}}" \
  'display-popup -w 70% -h 70% -T " Main windows " -E "~/.config/tmux/scripts/session_switch.sh"' \
  "run-shell -b \"tmux display-popup -c '#{client_name}' -w 70% -h 70% -T ' Pinned branches ' -S 'fg=##f38ba8' -E '~/.config/tmux/scripts/pins.sh pick #{session_name} #{client_name}'\""
# run-shell around display-popup: run-shell expands #{...}, a bare popup doesn't
bind-key F run-shell -b "tmux display-popup -c '#{client_name}' -w 70% -h 70% -T ' Pinned projects ' -S 'fg=##f38ba8' -E '~/.config/tmux/scripts/project_nav.sh pick #{session_name} #{client_name}'"
bind-key n command-prompt { find-window -Z "%%" }
bind-key o run-shell -b "~/.config/tmux/scripts/preview.sh '#{session_name}' --picker '#{client_name}'"
bind-key O display-popup -w 60% -h 50% -T " Open port " -E "~/.config/tmux/scripts/port_open.sh"
bind-key p run-shell "~/.config/tmux/scripts/last_session.sh toggle '#{session_name}' '#{client_name}'"
unbind-key g
unbind-key s
bind-key a run-shell "~/.config/tmux/scripts/pins.sh toggle '#{session_name}' '#{client_name}'"
bind-key N run-shell "~/.config/tmux/scripts/branch_cycle.sh next '#{session_name}' '#{client_name}'"
bind-key P run-shell "~/.config/tmux/scripts/branch_cycle.sh prev '#{session_name}' '#{client_name}'"
bind-key X confirm-before -p "kill session #S and go to Sys? (y/n)" "run-shell \"~/.config/tmux/scripts/pins.sh destroy '#{session_name}' '#{client_name}'\""

# Make sure the 4 main sessions exist when the server boots (deferred to
# the post-restore hook when there's a resurrect save - see the script).
run-shell "~/.config/tmux/bootstrap_sys.sh"

# Background busy/done poller for every window of every code session - see activity_monitor.sh. Guards against
# duplicate loops itself (pidfile), so this is safe on every config reload.
run-shell -b "~/.config/tmux/scripts/activity_monitor.sh"

# prefix+v: tmux's own built-in session tree (no fzf, no filtering) -
# the stock picker tmux ships with before any of this customization.
bind-key v choose-tree -Zs

# The session's bios (scripts/session_bios.sh, ~/.local/state/tmux/session-bios.tsv), from
# tmux's prompt: ":vue 4000", ":vue auto" for the next free port, ":unproject",
# and ":link /page" for the page alt opens.
# Aliases to set-option because an alias can only pass on one argument, and
# run-shell drops them; the hook does the work.
set -s command-alias[100] "vue=set-option @vue"
set -s command-alias[101] "unproject=set-option @unproject 1"
set -s command-alias[102] "link=set-option @link"
set-hook -g after-set-option[70] "if-shell -F '#{m/r:^@(vue|unproject|link),#{hook_arguments}}' \"run-shell -b '~/.config/tmux/scripts/session_bios.sh hook #{session_name} #{q:pane_current_path} #{client_name} #{hook_arguments}'\""


# alt+` drop-down (i3 -> ~/.config/i3/scripts/toggle_scratch.sh ->
# scripts/dropdown.sh attach): remembers the session you last chose in it.
# Every session change of the drop-down's client (hub, pickers, pins,
# prefix+j/k) is recorded; other clients are ignored. The second hook
# remembers the last main / last code session for prefix+p. Indexed
# set-hook -g (not -ag) so reloading this file doesn't stack duplicates.
set-hook -g 'client-session-changed[0]' 'run-shell -b "~/.config/tmux/scripts/dropdown.sh record #{client_tty} #{session_name}"'
set-hook -g 'client-session-changed[1]' 'run-shell -b "~/.config/tmux/scripts/last_session.sh record #{session_name}"'

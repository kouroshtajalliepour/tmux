##### PROJECT WORKFLOW #####
# A "project session" has windows 0:repo 7:vi 8:tr 9:ai, all in the
# project's directory (built by scripts/tmux-sessionizer). Windows 1-6 are
# left free for whatever extra terminals you add yourself. See scripts/
# for the logic behind each binding below.
#
# Four fixed sessions you maintain by hand (Sys/Infra/Media/Todos -
# tmux-resurrect/continuum keep them around across restarts) are reached
# directly, no picker. Lowercase and Shift+<letter> are independent
# bindings. k/K trigger Packages (not j/J) since k sits right next to l
# on the keyboard, same as live-websites - the session-name prefix for
# Packages sessions is still "j-" either way, only the key that reaches
# it changed:
#   h (left)        = always jump straight to session "Todos"
#   H (Shift+left)  = always jump straight to session "Infra"
#   j (down)        = always jump straight to session "Sys"
#   J (Shift+down)  = always jump straight to session "Media"
#   k (up)          = full-screen branch picker scoped to the LAST
#                      Packages project you were in - opens the full
#                      project picker instead if there isn't one yet
#   K (Shift+up)    = always opens the Packages picker directly
#   l (right)       = full-screen branch picker scoped to the LAST
#                      live-websites project you were in - opens the
#                      full project picker instead if there isn't one yet
#   L (Shift+right) = always opens the live-websites picker directly
# prefix+m opens the PlayStation-button-style hub (press h/j/k/l there),
# and prefix+h/j/k/l/H/J/K/L are the exact same destinations directly -
# no hub screen in between. This takes over h/j/k/l from pane navigation
# (bindings.conf); use the arrow keys for that instead (tmux's own
# default, unaffected by any of this).

bind-key m display-popup -B -w 100% -h 100% -E "~/.config/tmux/scripts/category_hub.sh"

bind-key h switch-client -t Todos
bind-key H switch-client -t Infra
bind-key j switch-client -t Sys
bind-key J switch-client -t Media
bind-key k run-shell "~/.config/tmux/scripts/jump_last.sh j '$HOME/Documents/Packages' j ' Packages ' '#cba6f7'"
bind-key K display-popup -w 70% -h 70% -T " Packages " -S "fg=#cba6f7" -E "~/.config/tmux/scripts/tmux-sessionizer '$HOME/Documents/Packages' j"
bind-key l run-shell "~/.config/tmux/scripts/jump_last.sh l '$HOME/Documents/Projects/live-websites' l ' live-websites ' '#a6e3a1'"
bind-key L display-popup -w 70% -h 70% -T " live-websites " -S "fg=#a6e3a1" -E "~/.config/tmux/scripts/tmux-sessionizer '$HOME/Documents/Projects/live-websites' l"

# prefix+g: branch picker for the project you're already in, already-cloned
# branches only (works only from a j-/l-/lr- session). Want a branch that
# isn't cloned yet? Just `git worktree add` by hand. Each row shows its
# quick-select number and a "*" once activity_monitor.sh notices that
# branch's ai window (9) went from busy to idle.
bind-key g display-popup -w 70% -h 70% -T " Branches " -S "fg=#f38ba8" -E "~/.config/tmux/scripts/branch_picker.sh"

# prefix+s: fzf session switcher (same picker style as the rest of these).
bind-key s display-popup -w 70% -h 70% -T " Sessions " -E "~/.config/tmux/scripts/session_switch.sh"

# Make sure the always-on `sys` session exists every time the server boots.
run-shell "~/.config/tmux/bootstrap_sys.sh"

# Background busy/done poller for window 9 ("ai") across every Packages/
# live-websites session - see activity_monitor.sh. Guards against
# duplicate loops itself (pidfile), so this is safe on every config reload.
run-shell -b "~/.config/tmux/scripts/activity_monitor.sh"

# prefix+v: tmux's own built-in session tree (no fzf, no filtering) -
# the stock picker tmux ships with before any of this customization.
bind-key v choose-tree -Zs

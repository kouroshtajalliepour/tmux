##### PROJECT WORKFLOW #####
# A "project session" has windows 0:main 1:code 2:term 3:ai, all in the
# project's directory (built by scripts/tmux-sessionizer). See scripts/ for
# the logic behind each binding below.

# prefix+S: fzf-pick a project under ~/Documents. Opens it if the session
# already exists, otherwise builds the 0:main/1:code/2:term/3:ai layout.
bind-key S display-popup -w 70% -h 70% -T " Projects " -E "~/.config/tmux/scripts/tmux-sessionizer"

# prefix+s: themed session tree (built-in session/window chooser).
bind-key s choose-tree -Zs -F "#{?session_attached,● ,  }#{session_name}#{?session_attached, (attached),}"

# prefix+B: bulk-switch the code/term/ai windows to another branch. Only
# runs when the current session actually has that layout.
bind-key B display-popup -w 70% -h 70% -T " Switch Branch " -E "~/.config/tmux/scripts/branch_switch.sh"

# Make sure the always-on `sys` session exists every time the server boots.
run-shell "~/.config/tmux/bootstrap_sys.sh"

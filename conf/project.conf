##### PROJECT WORKFLOW #####
# A "project session" has windows 0:repo 7:vi 8:tr 9:ai, all in the
# project's directory (built by scripts/tmux-sessionizer). Windows 1-6 are
# left free for whatever extra terminals you add yourself. See scripts/
# for the logic behind each binding below.
#
# Four fixed sessions you maintain by hand (Sys/Infra/Media/Todos -
# tmux-resurrect/continuum keep them around across restarts) are reached
# directly, no picker. Packages/live-websites are the two actual
# pickers. Lowercase and Shift+<letter> are independent bindings:
#   h (left)        = always jump straight to session "Todos"
#   H (Shift+left)  = always jump straight to session "Infra"
#   j (down)        = picker over ~/Documents/Packages            "Packages"
#   k (up)          = always jump straight to session "Sys"
#   K (Shift+up)    = always jump straight to session "Media"
#   l (right)       = picker over ~/Documents/Projects/live-websites "live-websites"
# prefix+m opens the PlayStation-button-style hub (press h/j/k/l there),
# and prefix+h/j/k/l/H/K are the exact same destinations directly - no
# hub screen in between. This takes over h/j/k/l from pane navigation
# (bindings.conf); use the arrow keys for that instead (tmux's own
# default, unaffected by any of this).

bind-key m display-popup -w 60% -h 60% -T " Pick a category " -E "~/.config/tmux/scripts/category_hub.sh"

bind-key h switch-client -t Todos
bind-key H switch-client -t Infra
bind-key j display-popup -w 70% -h 70% -T " Packages " -S "fg=#cba6f7" -E "~/.config/tmux/scripts/tmux-sessionizer '$HOME/Documents/Packages' j"
bind-key k switch-client -t Sys
bind-key K switch-client -t Media
bind-key l display-popup -w 70% -h 70% -T " live-websites " -S "fg=#a6e3a1" -E "~/.config/tmux/scripts/tmux-sessionizer '$HOME/Documents/Projects/live-websites' l"

# prefix+C: clone a GitHub repo into any folder under ~/Documents (pick
# the folder, paste the URL, multi-select which branches to worktree).
bind-key C display-popup -w 70% -h 70% -T " Clone " -E "~/.config/tmux/scripts/doc_clone.sh"

# prefix+s: fzf session switcher (same picker style as the rest of these).
bind-key s display-popup -w 70% -h 70% -T " Sessions " -E "~/.config/tmux/scripts/session_switch.sh"

# prefix+B: bulk-switch the code/term/ai windows to another branch. Only
# runs when the current session actually has that layout.
bind-key B display-popup -w 70% -h 70% -T " Switch Branch " -E "~/.config/tmux/scripts/branch_switch.sh"

# Make sure the always-on `sys` session exists every time the server boots.
run-shell "~/.config/tmux/bootstrap_sys.sh"

# prefix+v: tmux's own built-in session tree (no fzf, no filtering) -
# the stock picker tmux ships with before any of this customization.
bind-key v choose-tree -Zs

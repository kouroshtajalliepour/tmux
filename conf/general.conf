##### GENERAL #####
set -g base-index 0
setw -g pane-base-index 0
set -g renumber-windows on
set -g mode-keys vi

# Ctrl+a is the only prefix - Ctrl+b (tmux's default) is freed up entirely.
# Heads up: this means Ctrl+a stops reaching readline/bash directly inside
# any tmux pane (its normal "jump to start of line" meaning) - press it
# twice (prefix, then Ctrl+a again) to send the literal keystroke through.
unbind-key C-b
set -g prefix C-a
bind-key C-a send-prefix

# fish for every new pane/window, system login shell (bash) untouched
set -g default-shell /usr/sbin/fish

##### CLEAN BEHAVIOR #####
set -g allow-rename off
set -g history-limit 10000

##### PLUGINS #####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

##### AUTO SAVE/RESTORE #####
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'
set -g @resurrect-save '`'
set -g @resurrect-capture-pane-contents 'on'
# After any restore (manual or continuum), snap the `sys` session's `main`
# window back to $HOME instead of wherever it was last saved in.
set -g @resurrect-hook-post-restore-all '~/.config/tmux/scripts/post_restore.sh'

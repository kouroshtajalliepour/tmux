##### GENERAL #####
set -g base-index 0
setw -g pane-base-index 0
set -g renumber-windows on
set -g mode-keys vi

# production branch: prefix is Ctrl+s instead of tmux's default Ctrl+b.
unbind-key C-b
set -g prefix C-s

# fish for every new pane/window, system login shell (bash) untouched
set -g default-shell /usr/sbin/fish

##### CLEAN BEHAVIOR #####
set -g allow-rename off
set -g history-limit 10000

##### PLUGINS #####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

##### AUTO SAVE/RESTORE #####
# Off on production: this branch has no default sessions of its own, and
# an auto-restore would otherwise bring back whatever was last saved from
# a different branch's session layout (resurrect's save file isn't
# branch-scoped).
set -g @continuum-restore 'off'
set -g @continuum-save-interval '10'
set -g @resurrect-save '`'
set -g @resurrect-capture-pane-contents 'on'
# After any restore (manual or continuum), snap the `sys` session's `main`
# window back to $HOME instead of wherever it was last saved in.
set -g @resurrect-hook-post-restore-all '~/.config/tmux/scripts/post_restore.sh'
